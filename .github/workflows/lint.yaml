name: Checks

on:
    push:
        branches: [main]
    pull_request: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: pnpm/action-setup@v2
              with:
                  version: 11

            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  pnpm install --no-verify-store-integrity || (rm -rf pnpm-lock.yaml && pnpm install --no-verify-store-integrity)

            - name: Check Prettier formatting
              run: "pnpm run prettier"

            - name: Install library dependencies
              run: |
                  cd src && (pnpm install --no-verify-store-integrity || (rm -rf pnpm-lock.yaml && pnpm install --no-verify-store-integrity))

            - name: Compile library
              run: "cd src && pnpm run compile"

            - name: Check Types
              run: "pnpm run types"

            - name: Run Phase 1 tests with coverage
              env:
                  NODE_V8_COVERAGE: coverage
              run: "pnpm run test:phase1:coverage"

            - name: Upload Phase 1 coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: phase1-coverage
                  path: coverage/
