name: Checks

on:
    push:
        branches: [main]
    pull_request: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: pnpm/action-setup@v2
              with:
                  version: 11

            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  pnpm install --no-verify-store-integrity || (rm -rf pnpm-lock.yaml && pnpm install --no-verify-store-integrity)

            - name: Fix Prettier formatting
              run: "pnpm run prettier:fix"

            - name: Commit formatting changes
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if ! git diff-index --quiet HEAD --; then
                    git commit -m "style: auto-fix formatting with prettier"
                    git push
                  fi

            - name: Install library dependencies
              run: |
                  cd src && (pnpm install --no-verify-store-integrity || (rm -rf pnpm-lock.yaml && pnpm install --no-verify-store-integrity))

            - name: Compile library
              run: "cd src && pnpm run compile"

            - name: Check Types
              run: "pnpm run types"
