name: Checks

on:
    push:
        branches: [main]
    pull_request: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: pnpm/action-setup@v2
              with:
                  version: 11

            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  pnpm install --no-verify-store-integrity || (rm -rf pnpm-lock.yaml && pnpm install --no-verify-store-integrity)

            - name: Check Prettier formatting
              run: "pnpm run prettier"

            - name: Install library dependencies
              run: |
                  cd src && (pnpm install --no-verify-store-integrity || (rm -rf pnpm-lock.yaml && pnpm install --no-verify-store-integrity))

            - name: Prepare disk space for MongoDB tests
              run: |
                  sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
                  sudo apt-get clean
                  available_kb="$(df --output=avail -k / | tail -n 1)"
                  if [ "$available_kb" -lt 524288 ]; then
                      echo "::error title=Insufficient disk space::MongoDB tests require at least 500 MiB free"
                      exit 1
                  fi
                  df -h /

            - name: Cache MongoDB binary
              uses: actions/cache@v4
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Compile library
              run: "cd src && pnpm run compile"

            - name: Check Types
              run: "pnpm run types"

            - name: Run Phase 1 tests with coverage
              env:
                  NODE_V8_COVERAGE: coverage
              run: "pnpm run test:phase1:coverage"

            - name: Run Phase 2A integration tests
              run: "pnpm run test:integration"

            - name: Upload Phase 1 coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: phase1-coverage
                  path: coverage/
